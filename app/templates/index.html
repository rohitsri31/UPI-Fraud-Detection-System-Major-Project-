<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UPI Fraud Monitor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <span class="navbar-brand fw-semibold mb-0">UPI Fraud Monitor</span>
      <span id="model-badge" class="badge text-bg-secondary">Checking model...</span>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="card stat"><div class="card-body">
          <div class="stat-label">Transactions scored</div>
          <div id="stat-total" class="stat-value">0</div>
        </div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat"><div class="card-body">
          <div class="stat-label">Flagged</div>
          <div id="stat-flagged" class="stat-value">0</div>
        </div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat"><div class="card-body">
          <div class="stat-label">Flag rate</div>
          <div id="stat-rate" class="stat-value">0%</div>
        </div></div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card stat"><div class="card-body">
          <div class="stat-label">Flag threshold</div>
          <div id="stat-threshold" class="stat-value">-</div>
        </div></div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Check a transaction</h2>
            <form id="score-form" novalidate>
              <div class="row g-3">
                <div class="col-6">
                  <label class="form-label" for="amount">Amount (INR)</label>
                  <input class="form-control" id="amount" type="number" min="1" step="0.01" required>
                </div>
                <div class="col-6">
                  <label class="form-label" for="typical_amount">Usual payment (INR)</label>
                  <input class="form-control" id="typical_amount" type="number" min="1" step="0.01"
                         placeholder="same as amount">
                </div>
                <div class="col-6">
                  <label class="form-label" for="txn_type">Type</label>
                  <select class="form-select" id="txn_type">
                    <option value="p2p">Person to person</option>
                    <option value="merchant">Merchant</option>
                    <option value="collect_request">Collect request</option>
                    <option value="qr_scan">QR scan</option>
                  </select>
                </div>
                <div class="col-3">
                  <label class="form-label" for="hour">Hour (0-23)</label>
                  <input class="form-control" id="hour" type="number" min="0" max="23" step="1">
                </div>
                <div class="col-3">
                  <label class="form-label" for="txns_last_hour">Last hour</label>
                  <input class="form-control" id="txns_last_hour" type="number" min="0" step="1" value="0"
                         title="Payments by this user in the last hour">
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_new_payee">
                    <label class="form-check-label" for="is_new_payee">First payment to this payee</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_new_device">
                    <label class="form-check-label" for="is_new_device">Unrecognised device</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="is_new_city">
                    <label class="form-check-label" for="is_new_city">Unusual location</label>
                  </div>
                </div>
              </div>
              <div class="d-flex flex-wrap gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Check transaction</button>
                <button type="button" class="btn btn-outline-secondary" data-preset="normal">Normal example</button>
                <button type="button" class="btn btn-outline-danger" data-preset="suspicious">Suspicious example</button>
              </div>
            </form>

            <div id="form-error" class="alert alert-danger mt-3 mb-0" role="alert" hidden></div>

            <div id="result" class="mt-4" hidden>
              <div id="result-banner" class="alert mb-3" role="status">
                <div id="result-title" class="fw-semibold"></div>
                <div id="result-prob" class="small"></div>
              </div>
              <div class="progress mb-3" role="progressbar" aria-label="Fraud probability">
                <div id="result-bar" class="progress-bar"></div>
              </div>
              <div class="small text-secondary mb-1">Why it may be risky</div>
              <ul id="result-indicators" class="mb-0 ps-3"></ul>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="card">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
              <h2 class="h5 mb-0">Recent transactions</h2>
              <div class="btn-group btn-group-sm" role="group" aria-label="Filter">
                <button type="button" class="btn btn-outline-secondary active" data-filter="all">All</button>
                <button type="button" class="btn btn-outline-secondary" data-filter="flagged">Flagged only</button>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0">
                <thead>
                  <tr><th>Time</th><th>Amount</th><th>Type</th><th>Risk</th><th>Reasons</th></tr>
                </thead>
                <tbody id="txn-body"></tbody>
              </table>
            </div>
            <p id="txn-empty" class="text-secondary small mb-0 mt-3">
              Nothing here yet. Check a transaction to see it listed.
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
